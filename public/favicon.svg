<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fond dégradé doré -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa8c2c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Fond circulaire -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  <circle cx="100" cy="100" r="95" fill="url(#centerGlow)"/>

  <!-- Cercle de bordure -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#d4af37" stroke-width="1"/>

  <!-- Ornements géométriques (motif islamique) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.3">
    <circle cx="100" cy="100" r="70"/>
    <circle cx="100" cy="100" r="60"/>
  </g>

  <!-- Texte arabe central - محمد (Muhammad) en calligraphie -->
  <text
    x="100"
    y="100"
    font-family="Arial, sans-serif"
    font-size="65"
    font-weight="bold"
    text-anchor="middle"
    fill="#1a1a1a"
    direction="rtl"
    style="font-family: 'Traditional Arabic', 'Simplified Arabic', Arial; letter-spacing: 0px;">
    محمد
  </text>

  <!-- Symbole de salutation - ﷺ (Salla Allahu Alayhi Wa Sallam) - TRÈS GROS EN BAS -->
  <text
    x="100"
    y="145"
    font-family="Arial, sans-serif"
    font-size="60"
    font-weight="bold"
    text-anchor="middle"
    fill="#1a1a1a">
    ﷺ
  </text>

  <!-- Ligne décorative au-dessus -->
  <line x1="50" y1="45" x2="140" y2="45" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>

  <!-- Ligne décorative au-dessous -->
  <line x1="50" y1="155" x2="140" y2="155" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>

  <!-- Petits ornements aux coins -->
  <circle cx="35" cy="35" r="3" fill="#1a1a1a" opacity="0.5"/>
  <circle cx="165" cy="35" r="3" fill="#1a1a1a" opacity="0.5"/>
  <circle cx="35" cy="165" r="3" fill="#1a1a1a" opacity="0.5"/>
  <circle cx="165" cy="165" r="3" fill="#1a1a1a" opacity="0.5"/>
</svg>




